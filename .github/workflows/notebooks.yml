name: Notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Instantiate project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run all Pluto notebooks headless
        env:
          GKSwstype: '100'   # GR renders off-screen (no display on CI)
        run: julia --project=. ci/check_notebooks.jl
